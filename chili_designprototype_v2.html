ed.has(i)?'checked':''} onchange="this.checked?checked.add(${i}):checked.delete(${i})"> ${q(a)} ${b}</label>`).join('')}<div class="clear"></div><p>🍴 Utstyr: kjele, stekepanne, kniv, fjøl, dørslag og termometer.</p></div><button class="green" style="width:100%" onclick="s=0;go('cook')">Slik gjør du – steg for steg →</button>`}else if(view==='cook'){h=`<div class="row"><button onclick="go('recipe')">←</button><h2>Steg ${s+1} av 7</h2></div><div class="progress">${'●'.repeat(s+1)}${'○'.repeat(6-s)}</div><div class="paper"><h1><span class="num">${s+1}</span> ${steps[s][0]}</h1>${s===2?pic('step'):s===6?pic('food'):''}<p>${steps[s][1]()}</p><button onclick="if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(steps[s][1]());u.lang='nb-NO';speechSynthesis.speak(u)}">🔊 Les opp</button></div><div class="grid"><div class="paper tip"><h3>💡 Chili-trikset!</h3>Gjør klar råvarene før du begynner.</div><div class="paper tip"><h3 style="background:#83b94b">🪙 Spar spenn!</h3>Bruk kyllinglårfilet hvis den er billigere.</div><div class="paper tip"><h3 style="background:#d72720;color:white">⚠️ Oi, pass på!</h3>Bruk ren tallerken til stekt kylling.</div><div class="paper tip"><h3 style="background:#245bc3;color:white">Chili redder dagen!</h3>Er sausen tykk? Tilsett litt pastavann.</div></div><div class="row"><button onclick="if(s>0){s--;go('cook')}else go('recipe')">← Forrige</button><button class="green" onclick="if(s<6){s++;go('cook')}else go('done')">${s===6?'Ferdig!':'Neste steg →'}</button></div>`}else if(view==='done'){h='<div class="paper"><h1>🎉 God appetitt!</h1><button onclick="go(&quot;home&quot;)">Til forsiden</button></div>'}else if(view==='favorites'){h=`<h2>Favoritter</h2><div class="paper">${fav?'<button onclick="go(&quot;recipe&quot;)">Kremet kyllingpasta</button>':'Ingen favoritter ennå.'}</div>`}else{h=`<h2>Handleliste</h2><div class="paper">${ingredients.map(([a,b])=>`<label><input type="checkbox"> ${q(a)} ${b}</label>`).join('')}</div>`}document.getElementById('app').innerHTML=h+`<nav><button onclick="go('home')">🏠 Hjem</button><button onclick="go('favorites')">♡ Favoritter</button><button onclick="go('shopping')">🛒 Handleliste</button></nav>`}render();</script></html>
